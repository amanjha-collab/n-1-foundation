  <body>
    <div id="root"></div>
    <script>
      (function () {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });

        function tagAndObserve() {
          document.querySelectorAll('section:not([data-reveal-init])').forEach(function (el) {
            if (el.closest('[role="dialog"]')) return;
            el.setAttribute('data-reveal-init', '1');
            el.classList.add('reveal-on-scroll');
            io.observe(el);
          });
        }

        tagAndObserve();
        var rootEl = document.getElementById('root');
        if (rootEl) {
          new MutationObserver(tagAndObserve).observe(rootEl, { childList: true, subtree: true });
        }
      })();
    </script>
