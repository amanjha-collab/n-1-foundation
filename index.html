          "/testimony": { title: "Testimonials | What People Say About Us | n+1 Social Foundation", description: "Real stories from volunteers, parents, and students who have experienced the impact of n+1 Social Foundation's programs firsthand." }
        };
        function updateMeta(pathname) {
          var data = seoData[pathname] || seoData["/"];
          if (!data) return;
          document.title = data.title;
          var metaDesc = document.querySelector('meta[name="description"]');
          if (metaDesc) metaDesc.setAttribute("content", data.description);
          var ogTitle = document.querySelector('meta[property="og:title"]');
          if (ogTitle) ogTitle.setAttribute("content", data.title);
          var ogDesc = document.querySelector('meta[property="og:description"]');
          if (ogDesc) ogDesc.setAttribute("content", data.description);
          var canonical = document.querySelector('link[rel="canonical"]');
          if (canonical) {
            var base = "https://www.nplusone.org.in";
            canonical.setAttribute("href", pathname === "/" ? base + "/" : base + pathname);
          }
        }
        updateMeta(window.location.pathname);
        var origPushState = history.pushState;
        var origReplaceState = history.replaceState;
        function fireUpdate() { updateMeta(window.location.pathname); }
        history.pushState = function () { origPushState.apply(this, arguments); fireUpdate(); };
        history.replaceState = function () { origReplaceState.apply(this, arguments); fireUpdate(); };
        window.addEventListener("popstate", fireUpdate);
      })();
    </script>

    <script>
      (function () {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
        function tagAndObserve() {
          document.querySelectorAll('section:not([data-reveal-init])').forEach(function (el) {
            if (el.closest('[role="dialog"]')) return;
            el.setAttribute('data-reveal-init', '1');
            el.classList.add('reveal-on-scroll');
            io.observe(el);
          });
        }
        tagAndObserve();
        var rootEl = document.getElementById('root');
        if (rootEl) {
          new MutationObserver(tagAndObserve).observe(rootEl, { childList: true, subtree: true });
        }
      })();
    </script>
